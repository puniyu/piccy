name: release
on:
  push:
    branches:
      - main
  pull_request_target:
    branches-ignore:
      - 'release-please**'
  workflow_dispatch:

env:
  APP_NAME: piccy

permissions:
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release:
    if: "!startsWith(github.head_ref, 'release-please')"
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.release-please.outputs['piccy_core--release_created'] }}
      node: ${{ steps.release-please.outputs['piccy_node--release_created'] }}
      node_tag_name: ${{ steps.release-please.outputs['piccy_node--tag_name'] }}
    steps:
      - name: 获取token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 运行 release-please-action
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-crates-io:
    needs: release
    runs-on: ubuntu-latest
    if: needs.release.outputs.core
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 rust
        uses: puniyu/setup-rust@2cef712a6ec7b46c19504363b311cb90bb32d333 # main
        with:
          save-cache: true
          prefix-key: ${{ env.APP_NAME }}

      - name: 发布piccy_core
        run: |
          cargo publish --package piccy_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}

  build:
    needs: release
    uses: ./.github/workflows/build.yaml

  publish-npm-lib:
    needs: [ build, release ]
    if: needs.release.outputs.node
    runs-on: ubuntu-latest
    steps:
      - name: 获取token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 下载npm包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "npm-package"
          path: piccy-node

      - name: 下载wasm包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "npm-wasm"
          path: piccy-node

      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: piccy-node*
          path: piccy-node/artifacts

      - name: Setup Nodejs
        uses: puniyu/setup-node@af0f53e773ab16523ac167460cb4e95daae92550 # main
        with:
          node-version: lts/*
          pnpm-version: 10.25.0
          cache: true

      - name: 发布npm包
        run: |
          pnpm install
          pnpm config set provenance true
          pnpm config set registry https://registry.npmjs.org/
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          pnpm run create-npm-dirs
          pnpm run artifacts
          pnpm publish --access public
        working-directory: piccy-node
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 上传Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          files: |
            piccy-node/artifacts/piccy-node-*/piccy*.node
            piccy-node/artifacts/piccy-node-*/piccy*.wasm
          tag_name: ${{ needs.release.outputs.node_tag_name }}